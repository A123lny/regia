# CI locale replicata in GitHub Actions.
# Trigga su ogni push e ogni PR verso main.
# Usa Supabase locale (Docker in runner Ubuntu) per replicare fedelmente
# l'ambiente dev — nessuna dipendenza dal cloud production per i test.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint + Types + Boundaries + Migrations + Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase locally
        run: npx supabase start

      - name: Get Supabase env
        run: npx supabase status -o env > .env.local

      - name: 1/6 Lint (ESLint)
        run: npm run lint

      - name: 2/6 Formattazione (Prettier check)
        run: npm run format:check

      - name: 3/6 Typecheck (TypeScript strict)
        run: npm run typecheck

      - name: 4/6 Confini di modulo (RS-1, dependency-cruiser)
        run: npm run boundaries

      - name: 5/6 Verifica migrazioni (RS-8)
        run: npx supabase db reset --no-seed

      - name: 6/6 Test invarianti + boundaries (Vitest)
        run: npx dotenv -e .env.local -- npm test

      - name: Stop Supabase
        if: always()
        run: npx supabase stop
